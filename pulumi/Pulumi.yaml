name: home-cluster
description: Typescript pulumi for homelab
runtime:
  name: nodejs
  options:
    packagemanager: npm
config:
  pulumi:tags:
    value:
      pulumi:template: typescript
packages:
  proxmox:
    source: terraform-provider
    version: 1.3.0
    parameters:
      - bpg/proxmox
  ct:
    source: terraform-provider
    version: 1.3.0
    parameters:
      - poseidon/ct
