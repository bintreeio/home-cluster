# Maps compose env var names to Bitwarden Secrets Manager secret IDs, per app folder.
# The deploy playbooks resolve each ID with `bws secret get` on the control machine and
# write the values into /docker/<app>/.env on the host. Non-secret config lives in
# ansible/inventory/{group_vars,host_vars} (docker_app_env), never here.
#
# Find IDs with: bws secret list --color no -o json | jq -r '.[] | "\(.id)  \(.key)"'
caddy:
  env_variables:
    PORKBUN_API_KEY: ae22cae4-db54-49b9-8ad8-b4b1002f2d50        # porkbun_api_key
    PORKBUN_API_SECRET_KEY: a5332ebf-0a7d-40a5-86d1-b4b1002f410c # porkbun_secret_key
technitium:
  env_variables:
    # TODO: create the secret, then paste its ID here:
    #   bws secret create technitium_admin_password '<password>' cfd22449-9809-4fd7-8138-b49b00474178
    DNS_SERVER_ADMIN_PASSWORD: REPLACE_WITH_BWS_SECRET_ID          # technitium_admin_password
