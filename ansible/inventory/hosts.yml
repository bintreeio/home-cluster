# inventory.proxmox.yml
plugin: community.general.proxmox
url: https://pve01.home.bintree.io
user: ansible@pve
password: !vault | #placeholder until can verify
  $ANSIBLE_VAULT;1.1;AES256;...
validate_certs: false
want_facts: true

# Group by tags or name patterns
keyed_groups:
  - key: proxmox_tags_parsed
    separator: ""
    prefix: group

groups:
  debian: "'debian' in (proxmox_tags_parsed|list)"
  databases: "'db' in (proxmox_tags_parsed|list)"
  talos: "'talos'  in (proxmox_tags_parsed|list)"

compose:
  ansible_host: proxmox_ipconfig0.ip | default(proxmox_net0.ip) | ipaddr('address')