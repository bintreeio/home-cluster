# Host prerequisites for technitium: nothing else may listen on :53.

- name: Check whether systemd-resolved is active
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: resolved_state
  failed_when: false
  changed_when: false

- name: Disable the systemd-resolved DNS stub listener (frees :53)
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: DNSStubListener=no
    insertafter: '^\[Resolve\]'
  when: resolved_state.stdout == "active"
  register: resolved_conf

- name: Point /etc/resolv.conf at the upstream resolvers instead of the stub
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: resolved_state.stdout == "active"

- name: Restart systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
  when: resolved_conf is changed
