- name: Get Caddyfile inode on the host
  ansible.builtin.stat:
    path: "{{ app_dir }}/Caddyfile"
  register: caddyfile_host

- name: Get Caddyfile inode inside the container
  ansible.builtin.command: docker compose exec -T caddy stat -c %i /etc/caddy/Caddyfile
  args:
    chdir: "{{ app_dir }}"
  register: caddyfile_container
  changed_when: false

- name: Recreate caddy when the container holds a stale Caddyfile mount
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    recreate: always
    services:
      - caddy
  when: caddyfile_host.stat.inode | string != caddyfile_container.stdout | trim

- name: Reload the Caddyfile in the running container
  ansible.builtin.command: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
  args:
    chdir: "{{ app_dir }}"
  register: caddy_reload
  changed_when: "'config not modified' not in caddy_reload.stderr"
  when: caddyfile_host.stat.inode | string == caddyfile_container.stdout | trim
